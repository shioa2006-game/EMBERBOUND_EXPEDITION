<!doctype html><html lang="ja"><meta charset="utf-8"><title>Storybook scenery review</title>
<style>body{margin:22px;background:#17171e;color:#dfd5c7;font:14px system-ui}header{display:flex;align-items:center;gap:18px;margin-bottom:16px}h1{font-size:20px;margin:0}button{padding:7px 14px;background:#433a3c;border:1px solid #85725e;color:inherit;cursor:pointer}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;border:1px solid #51434a;background:#25212c}figcaption{padding:8px 12px}canvas{width:100%;display:block}#status{color:#b8c69c}p{max-width:1000px}</style>
<header><h1>Storybook scenery review</h1><button id="scroll">Scroll +240</button><button id="depth">Stages 1–4</button><button id="guides">Foot line</button><span id="status">Rendering…</span></header><main></main>
<script type="module">
import {drawStoryAreaBackground,drawStoryAreaForeground,drawStoryCampBackground,drawStoryTitleBackground} from '/src/render/storybook/scenes.ts';
import {getUnitSprite,drawCampScene} from '/src/render/sprites/index.ts';
import {paintCanvas} from '/src/render/storybook/surface.ts';
import {newSave} from '/src/core/state.ts';
const areas=['ashwood','ruins','glimmer','rimeholt','hollow','heart'];
const enemies=['gnarlwood','coilscale','geode_colossus','rimequeen','hollow_sovereign','shadow_guardian'];
const names=['灰燼の森','水没した神殿','燐光の洞窟','霜の城塞','虚無の深淵','残り火の心臓','野営地','タイトル'];
const canvases=names.map((name,i)=>{const f=document.createElement('figure');const t=document.createElement('figcaption');t.textContent=name;const c=document.createElement('canvas');c.width=1600;c.height=720;f.append(t,c);document.querySelector('main').append(f);return c;});
let scroll=0,guides=false,depth=0;const DEPTHS=['Stages 1–4','Stages 5–9','Boss (10)'];
function unit(g,key,x,y){const s=getUnitSprite(key,'idle',0,1);g.fillStyle='rgba(15,12,18,.3)';g.beginPath();g.ellipse(x,y,7,1.8,0,0,Math.PI*2);g.fill();paintCanvas(g,s.canvas,x-s.ax,y-s.ay);}
async function render(){document.querySelector('#status').textContent='Rendering…';const start=performance.now();for(let i=0;i<8;i++){await new Promise(requestAnimationFrame);const g=canvases[i].getContext('2d');g.setTransform(4,0,0,4,0,0);g.clearRect(0,0,400,180);if(i<6){drawStoryAreaBackground(g,areas[i],scroll,7,{lantern:1,flare:0,lightX:108,overdrive:false,depth});[['guardian',152,150],['ranger',120,146],['arcanist',90,151],['oracle',60,147]].forEach(([key,x,y])=>unit(g,key,x,y));unit(g,enemies[i],318,152);drawStoryAreaForeground(g,areas[i],scroll,7);}else if(i===6){const s=newSave();for(const h of Object.values(s.heroes))h.recruited=true;drawCampScene(g,s,7);}else drawStoryTitleBackground(g,7);if(guides){g.strokeStyle='#ff9292';g.lineWidth=.3;g.setLineDash([2,2]);g.beginPath();g.moveTo(0,150);g.lineTo(400,150);g.stroke();g.setLineDash([]);}}document.querySelector('#status').textContent=`Ready · scroll ${scroll} · ${DEPTHS[depth]} · ${Math.round(performance.now()-start)} ms`;}
document.querySelector('#scroll').onclick=()=>{scroll+=240;render();};document.querySelector('#depth').onclick=e=>{depth=(depth+1)%3;e.target.textContent=DEPTHS[depth];render();};document.querySelector('#guides').onclick=()=>{guides=!guides;render();};render();
</script></html>
