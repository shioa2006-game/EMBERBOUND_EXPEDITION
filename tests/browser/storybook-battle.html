<!doctype html><html lang="ja"><meta charset="utf-8"><title>Storybook battle verification</title>
<style>body{margin:20px;background:#15151d;color:#efe3c8;font:16px Georgia,serif}button{padding:10px;margin:6px;background:#3b3440;color:inherit;border:1px solid #987d57}#stage{width:min(1200px,100%);aspect-ratio:400/180;position:relative;border:1px solid #987d57}#shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}#shots canvas{width:100%;height:auto}#status{position:sticky;top:0;background:#26212b;padding:12px;z-index:10}.row{margin-bottom:10px}</style>
<h1>戦闘描画の統合検証</h1><p>独立したテスト用データで実行します。ゲームのセーブには書き込みません。</p>
<div id="status">検証中</div><div id="stage"></div><div class="row"><button id="run">再検証</button><button id="effects">魔法演出を再生</button></div><div id="shots"></div><pre id="results"></pre>
<script type="module">
import { Renderer } from '../../src/render/renderer.ts';
import { Battle } from '../../src/core/battle.ts';
import { newSave } from '../../src/core/state.ts';
import { HERO_ORDER, AREA_ORDER } from '../../src/core/types.ts';
import { AREAS } from '../../src/data/areas.ts';
import { prewarmStorySprites } from '../../src/render/storybook/characters.ts';
const status=document.querySelector('#status'),results=document.querySelector('#results'),stage=document.querySelector('#stage'),shots=document.querySelector('#shots');
const r=new Renderer(); r.mount(stage); r.setSettings({screenShake:true,damageNumbers:true});
const failures=[]; let b, running=false, scenarios=0, events=0;
function step(dt=1/60) { b.tick(dt); const e=b.drainEvents(); events+=e.length; r.pushEvents(e,b); r.renderBattle(b,dt); }
function make(area) {
 const save=newSave(0); save.prestige=1;
 for(const h of HERO_ORDER){save.heroes[h].recruited=true;save.heroes[h].level=50;}
 b=new Battle({save,areaId:area,seed:1234}); b.stage=9;
 for(const h of b.heroes){h.maxHp=h.hp=1000000;h.atk=40;}
 r.beginBattle(b); return save;
}
function capture(area){const card=document.createElement('section'),label=document.createElement('p'),c=document.createElement('canvas');label.textContent=AREAS[area].subtitle;c.width=1200;c.height=540;const g=c.getContext('2d');g.drawImage(stage.querySelector('.emb-world'),0,0,1200,540);g.drawImage(stage.querySelector('.emb-overlay'),0,0,1200,540);card.append(label,c);shots.append(card);}
async function verify(){if(running)return;running=true;failures.length=0;shots.replaceChildren();scenarios=events=0;
 try{for(const area of AREA_ORDER){status.textContent='検証中: '+area;make(area);
  await prewarmStorySprites([...HERO_ORDER.map(key=>({key,tier:3})),...AREAS[area].stages[9].variants[0].map(key=>({key}))]);
  for(let i=0;i<420;i++){
   if(i===170){for(const h of b.heroes)h.hp-=500; for(const h of HERO_ORDER)b.cast(h,true);}
   if(i===240){const h=b.heroes[0];h.frozen=.3;h.stun=.3;h.barrier=100;}
   step();if(i%20===0)await new Promise(resolve=>setTimeout(resolve,0));
   if(i===180)capture(area);
  }
  // Render both kinds of corpse and the held hero-death pose using real simulation damage events.
  for(const e of b.enemies){e.ward=0;e.hp=.01;e.untargetable=0;}
  for(const h of b.heroes)h.atkTimer=0;
  for(let i=0;i<180;i++){step();if(i%30===0)await new Promise(resolve=>setTimeout(resolve,0));}
  b.heroes[0].alive=false;b.heroes[0].hp=0;
  for(let i=0;i<40;i++)step();
  const canvas=stage.querySelector('.emb-world');
  if(canvas.width<800||canvas.height<360)throw new Error('Low-resolution world backing store');
  if(!r.clientToWorld(stage.getBoundingClientRect().x+stage.clientWidth/2,stage.getBoundingClientRect().y+stage.clientHeight/2))throw new Error('Coordinate mapping failed');
  scenarios++;
 }}catch(error){failures.push(String(error.stack||error));}
 const report={scenarios,events,failures};results.textContent=JSON.stringify(report,null,2);status.dataset.result=failures.length?'failed':'passed';status.textContent=failures.length?'失敗: '+failures[0]:'合格: 6エリアのボス戦・スキル・状態異常・撃破・戦闘不能';running=false;
}
document.querySelector('#run').onclick=verify;
document.querySelector('#effects').onclick=async()=>{if(running)return;running=true;make('glimmer');for(let i=0;i<160;i++)step();for(const h of HERO_ORDER)b.cast(h,true);let previous=performance.now();function animate(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;step(dt);if(b.time<12)requestAnimationFrame(animate);else running=false;}requestAnimationFrame(animate);};
verify();
</script></html>
