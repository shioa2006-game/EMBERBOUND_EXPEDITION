<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>UI layout verification</title>
<style>body{margin:0;padding:12px;background:#0d171e;color:#eee;font:14px system-ui}header{display:flex;gap:12px;align-items:center;margin-bottom:12px}button,select{font:inherit;padding:6px}iframe{display:block;border:0}pre{white-space:pre-wrap}#status{padding:8px}body.capture{padding:0}body.capture header,body.capture pre{display:none}</style></head>
<body><header><label>表示寸法 <select id="size"><option>1920x1080</option><option>1920x950</option><option>1440x900</option><option selected>1280x720</option><option>1024x600</option></select></label><label>場面 <select id="scenario"><option>early-expedition</option><option>early-party</option><option>early-tree</option><option>early-result</option><option>early-result-plain</option><option>late-expedition</option><option>late-party</option><option>late-tree</option><option>late-relics</option><option>late-result</option></select></label><button id="show">表示</button><button id="run">全サイズを検証</button><span id="status"></span></header><iframe id="frame" title="ゲームのUI検証画面"></iframe><pre id="results"></pre>
<script type="module">
const frame=document.querySelector('#frame'),size=document.querySelector('#size'),scenario=document.querySelector('#scenario'),status=document.querySelector('#status'),results=document.querySelector('#results');
let queue=[],reports=[],running=false;
const params=new URLSearchParams(location.search);
for(const name of ['settings','area','ending','true-ending','epilogue','rekindle','first-rekindle','rekindled','swap','party','tree-purchase','result-keys','milestone','pause','battle']){const o=document.createElement('option');o.value=o.textContent='review-'+name;scenario.append(o);}
if(params.has('capture'))document.body.classList.add('capture');
if([...size.options].some(o=>o.value===params.get('size')))size.value=params.get('size');
if([...scenario.options].some(o=>o.value===params.get('scenario')))scenario.value=params.get('scenario');
function show(){const[w,h]=size.value.split('x').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.src=(scenario.value.startsWith('review-')?'./playtest-ui-fixture.html':'./ui-layout-fixture.html')+'?scenario='+scenario.value+(params.has('capture')?'&preview':'');status.textContent='確認中 '+size.value+' '+scenario.value;}
function next(){if(!queue.length){running=false;status.textContent=reports.some(r=>r.failures.length)?'FAILED':'PASSED';results.textContent=JSON.stringify(reports,null,2);return;}const item=queue.shift();size.value=item.size;scenario.value=item.scenario;show();}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data.type!=='ui-layout-result')return;reports.push(e.data.report);results.textContent=JSON.stringify(reports,null,2);if(running)next();else status.textContent=e.data.report.failures.length?'FAILED':'PASSED';});
document.querySelector('#show').onclick=()=>{if(running)return;reports=[];show();};
document.querySelector('#run').onclick=()=>{if(running)return;reports=[];queue=[...size.options].flatMap(s=>[...scenario.options].map(c=>({size:s.value,scenario:c.value})));running=true;next();};show();
</script></body></html>
